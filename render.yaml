# ------------------------------------------------------------------
# Voxels — Render Blueprint.
#
# Being deployed for the first time. A Render account and a Blueprint now
# exist; this file is what they read. Cross-network play has still not been
# observed by anyone, so until two people on two different networks have
# actually met in the town, "it deploys" and "it works" are different
# claims — docs/going-public.md has the checks that tell them apart.
#
# RENDER IS A CHOICE, NOT A REQUIREMENT
# The application needs three things: a long-lived Node process that can
# hold WebSocket connections, durable storage for its two SQLite files,
# and somewhere to serve static files. Fly.io, Railway, Hetzner with
# Docker Compose, or a plain VPS all provide those. Everything
# Render-specific here lives in this file and in a handful of environment
# variables; the application code reads `PORT`, `DATABASE_URL` and
# `X-Forwarded-*`, which is the same contract every one of those
# platforms offers.
#
# THIS IS A MAINNET DEPLOYMENT
# SOLANA_CLUSTER and VITE_SOLANA_CLUSTER are both mainnet-beta, chosen
# deliberately. Consequences, so nobody discovers them later:
#   - Every player's wallet is a keypair generated in their browser and
#     stored in localStorage. On mainnet it holds real, spendable value,
#     and it is readable by any successful XSS on this origin and by
#     anyone with access to the machine. The client says so in a red
#     banner; that warning is now load-bearing rather than decorative.
#   - The "DEMO — NO REAL FUNDS" labelling switches OFF.
#   - Gold still cannot be redeemed for tokens. That is blocked on a
#     treasury signing key and a token mint, not on the cluster, so
#     mainnet does not enable a payout.
#   - NPC_PAYEE_ADDRESS must be an address you control. The value in the
#     local .env is a throwaway devnet fixture. Empty keeps payments off.
#
# WHAT COSTS MONEY (verified against render.com/pricing, current as of
# this file's commit — re-check before committing spend):
#
#   voxels-api (web service)
#     `free` exists but is wrong here: Render spins a Free web service
#     down after 15 minutes without traffic, and that explicitly includes
#     WebSocket messages from existing connections. A spun-down world is
#     a world where everyone's duel ended. Free also cannot scale, has no
#     disk, and may be restarted at any time.
#     -> 0.5c-512mb, $7/month. PAID, and not optional for a persistent world.
#
#   voxels-data (disk attached to voxels-api)
#     Holds the two SQLite files so accounts, characters, duel history and
#     the gold ledger survive a redeploy.
#     -> 1 GB. Render bills disks per GB per month; a single gigabyte is
#        cents. Raise sizeGB before it fills, not after.
#
#   voxels-web (static site)
#     -> FREE. Counts against the workspace's bandwidth and build minutes.
#
#   Workspace plan
#     -> Hobby is $0/month and covers all of the above. It includes 5 GB
#        of bandwidth and 500 build minutes per month; past those, $0.15
#        per GB and $5 per 1,000 minutes. Outbound WebSocket messages
#        count towards bandwidth. Pro is $25/month and is not needed here.
#
#   TOTAL: $7/month plus a gigabyte of disk. No Postgres and no worker in
#   this Blueprint — see the notes at each of those sections for why, and
#   for what to restore once the ledger moves off synchronous SQLite.
#
# SECRETS
# Every secret below is `sync: false`, which means Render prompts for it
# in the dashboard and never stores it in this file. Nothing secret is
# committed here and nothing secret may ever be added: `VITE_*` values
# are compiled into the public JavaScript bundle, which is what
# `npm run audit:bundle` exists to prove.
#
# BUILD AND RUN
# `--include=dev` is not decoration. Render sets NODE_ENV=production for
# Node services, and npm then skips devDependencies — which is where
# TypeScript and Vite live, so a plain `npm ci` produces a build that
# cannot build. `npm run build:server` is a typecheck (`tsc -b`, noEmit),
# so a type error fails the deploy and the previous version keeps serving
# rather than the error reaching a player. The server runs through `tsx`,
# which is a runtime dependency for that reason.
#
# After syncing this Blueprint, set by hand in the dashboard:
#   voxels-api  SOLANA_RPC_URL_MAINNET_BETA  (required — the app refuses to
#               boot on mainnet against the rate-limited public endpoint)
#   voxels-api  NPC_PAYEE_ADDRESS            (optional; empty = payments off)
# and update WALLY_PUBLIC_ORIGIN, WALLY_ALLOWED_ORIGINS and
# VITE_API_BASE_URL once Render has assigned the real hostnames, then
# redeploy the static site so the new API URL is compiled into the bundle.
# ------------------------------------------------------------------

services:
  # ---------------------------------------------------------------- api
  # Always-running Node process. Serves the HTTP API and holds every
  # WebSocket connection for the one authoritative world.
  #
  # DO NOT SET `numInstances` ABOVE 1 OR ADD `scaling`. The world lives in
  # this process's memory. Render's load balancer assigns each incoming
  # WebSocket connection to a random instance, so a second instance would
  # not be more capacity — it would be a second, separate town wearing the
  # same URL, and two players could open the game and not see each other.
  # There is no room ownership or routing in this codebase. Capacity is
  # raised by moving to a larger compute plan, not by adding instances.
  - type: web
    name: voxels-api
    runtime: node
    plan: 0.5c-512mb # PAID $7/mo. `free` spins down after 15 idle minutes.
    region: oregon
    numInstances: 1
    buildCommand: npm ci --include=dev && npm run build:server
    startCommand: npm run start:server
    # Liveness, not readiness. Render restarts an instance whose health
    # check fails, and restarting into a database outage helps nobody:
    # /api/live answers from the process alone, while /api/ready reports
    # the database and is what a human or an uptime monitor should watch.
    healthCheckPath: /api/live
    # NO maxShutdownDelaySeconds HERE. Render rejects the whole Blueprint with
    # "max shutdown delay is not supported for services with a disk", and the
    # disk below is what makes the data durable, so the disk wins.
    #
    # The drain still completes: Render's default grace is 30s and the app's own
    # budget is WALLY_SHUTDOWN_GRACE_MS=25000, which fits inside it with room to
    # spare. Keep that value under 30000 or a restart will be killed mid-drain,
    # which is how a duel ends with both stakes still held in escrow.
    envVars:
      - key: NODE_ENV
        value: production
      # Render assigns the port. The app reads it; nothing is hardcoded.
      - key: PORT
        value: 10000
      # Exactly one proxy hop sits in front of this process (Render's
      # router). The app counts X-Forwarded-For from the right, so this
      # number is what stops a client from spoofing its own rate-limit
      # bucket by sending its own X-Forwarded-For header.
      - key: WALLY_TRUST_PROXY_HOPS
        value: 1
      # The origin players type. Must be https: a ws:// upgrade to Render
      # is answered with a 301 that most WebSocket clients cannot follow.
      # Replace with the real hostname after the first sync, or with a
      # custom domain.
      - key: WALLY_PUBLIC_ORIGIN
        value: https://voxels-web.onrender.com
      # The static site is a different origin from the API, so it has to
      # be named. In production the app does NOT auto-trust private/LAN
      # origins, so this list is the whole policy.
      - key: WALLY_ALLOWED_ORIGINS
        value: https://voxels-web.onrender.com
      # SQLite on the attached disk, not Postgres.
      #
      # Postgres is the right long-term answer and this service is wired for
      # it, but src/server/store/ is still synchronous better-sqlite3 — about
      # 100 prepared statements across 11 modules, read by a 50ms world tick —
      # so selecting `postgres` today makes the process refuse to boot rather
      # than report a healthy database while writing money to a doomed file.
      # See the guard in src/server/config.ts. The disk below is what makes
      # SQLite durable enough to launch on in the meantime.
      - key: WALLY_DB_DRIVER
        value: sqlite
      # Both databases live on the disk: the finance path is derived from this
      # one, so wally.db and wally-finance.db sit side by side under /var/data.
      - key: WALLY_DB_PATH
        value: /var/data/wally.db
      # One world, one process. Published on /api/health so the number is
      # a promise rather than a hope; raise it with the compute plan.
      - key: WALLY_ROOM_CAPACITY
        value: 64
      - key: WALLY_SHUTDOWN_GRACE_MS
        value: 25000
      # MAINNET. Real funds. The client shows a red MAINNET — REAL FUNDS
      # banner, the demo labelling switches off, and the browser-held key in
      # localStorage is holding value that can actually be spent.
      # SOLANA_RPC_URL_MAINNET_BETA below is required: the app refuses to boot
      # on mainnet against the rate-limited public endpoint.
      - key: SOLANA_CLUSTER
        value: mainnet-beta
      # CREDENTIAL. The QuickNode/Helius access token is in the URL path.
      # Prompted for in the dashboard, never written here, never sent to
      # the browser, never logged — see src/server/redact.ts.
      - key: SOLANA_RPC_URL_DEVNET
        sync: false
      - key: SOLANA_RPC_URL_MAINNET_BETA
        sync: false
      # Public key only. Payments stay off while it is empty, which is the
      # right setting for launch. Do NOT paste the value from the local .env:
      # that is a throwaway devnet fixture keypair, and this deployment is
      # mainnet. A real payee address has to be one you control.
      - key: NPC_PAYEE_ADDRESS
        sync: false
    # Durable storage for the two SQLite files. Without this, a container
    # filesystem is wiped on every deploy and every restart, so accounts,
    # characters, duel history and the gold ledger would not survive a single
    # redeploy. A disk also pins the service to one instance, which this world
    # already requires, and rules out zero-downtime deploys: expect a few
    # seconds of downtime while the new instance takes the disk.
    disk:
      name: voxels-data
      mountPath: /var/data
      sizeGB: 1

  # ------------------------------------------------------- worker (none)
  # There is deliberately no separate worker service in this Blueprint.
  #
  # A Render disk cannot be shared between two services, and the worker needs
  # the same finance database as the API, so while persistence is SQLite-on-a-
  # disk a second service simply cannot reach the data.
  #
  # Nothing is lost today. The API already recovers stranded job leases every
  # 60 seconds and sweeps expired sessions itself — see the interval timers and
  # the comment about `npm run worker` being a process an operator can forget
  # to start, in src/server/index.ts. Payment reconciliation is the job class
  # that really wants a worker, and payments are off while NPC_PAYEE_ADDRESS
  # is empty.
  #
  # Restore the worker when src/server/store/ moves to Postgres. At that point
  # both services can reach one database and the 50ms world tick stops sharing
  # a process with blocking RPC calls.

  # ---------------------------------------------------------------- web
  # The built client. FREE — static sites have no compute plan.
  #
  # Served from Render's CDN rather than from the Node process, so the
  # game service spends its memory on WebSocket connections instead of
  # on shipping the same JavaScript bundle over and over.
  - type: web
    name: voxels-web
    runtime: static
    buildCommand: npm ci --include=dev && npm run build
    staticPublishPath: ./dist
    envVars:
      # PUBLIC. Everything prefixed VITE_ is compiled into the bundle and
      # is readable by anyone who loads the page. A provider URL, a
      # database URL or any other credential must never appear here;
      # `npm run audit:bundle` fails the build if one does.
      - key: VITE_API_BASE_URL
        value: https://voxels-api.onrender.com
      # Must match SOLANA_CLUSTER on the API, which the server cross-checks
      # against the endpoint's genesis hash and reports on /api/health.
      - key: VITE_SOLANA_CLUSTER
        value: mainnet-beta
    routes:
      # A single-page app: every path that is not a file is the app.
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: no-referrer
      - path: /*
        name: X-Frame-Options
        value: SAMEORIGIN

# ---------------------------------------------------------------- data
# No managed Postgres in this Blueprint, on purpose.
#
# Provisioning one today would bill $6/month for a database the application
# cannot use: src/server/config.ts refuses to boot when WALLY_DB_DRIVER is
# postgres, because the ledger is still synchronous SQLite and the alternative
# is a green health check over money written to a file no deploy survives.
#
# Durability comes from the disk attached to voxels-api instead. When
# src/server/store/ is converted to the async driver in src/server/sql/, add
# the database back and restore the worker with it:
#
# databases:
#   - name: voxels-db
#     databaseName: voxels
#     plan: 0.1c-256mb # $6/mo. `free` expires 30 days after creation.
#     region: oregon
#     ipAllowList: [] # Private network only.
