<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Roster harness</title>
    <style>
      body { margin: 0; background: #0d141c; font: 11px ui-monospace, monospace; color: #cfe3f0; }
      .row { display: grid; grid-template-columns: repeat(5, 240px); gap: 2px; margin: 0 12px 18px; }
      h2 { color: #d5a64b; font: 600 17px system-ui; margin: 14px 12px 6px; }
      h3 { color: #7bc9ce; font: 600 11px ui-monospace; margin: 8px 12px 4px; letter-spacing: .12em; }
      figcaption { padding: 3px 2px 0; }
      canvas { display: block; background: #152231; }
      .strip { display: grid; grid-template-columns: repeat(4, 320px); margin: 0 12px; }
      .strip.magenta canvas { background: #ff00ff; }
    </style>
  </head>
  <body>
    <!--
      Deterministic character harness.

      The in-app preview rotates on a clock, so two screenshots of an unchanged
      model never match and a pixel hash proves nothing. Every tile here is
      rendered once at a fixed yaw into a 2D canvas, which makes the hashes
      comparable: identical hash means identical render.

      Groups produced, all readable from window.__roster:
        contact     the four wayfinders side by side, default wardrobe
        silhouette  the same four with every material forced flat black on white
        solid       front and three-quarter over magenta, to expose any gap
        wardrobe    every option of every slot on every character
    -->
    <div id="contact"></div>
    <div id="silhouette"></div>
    <div id="solid"></div>
    <div id="wardrobe"></div>
    <script type="module">
      import * as THREE from 'three'
      const { createWizard, cycleStyle, defaultMothStyle, styleSlots, styleLabel, wizards } = await import('/src/characters.ts')

      const ids = ['MOTH', 'BRAMBLE', 'CINDER', 'ORBIT']
      const tiles = []

      // One shared WebGL context, blitted into plain 2D canvases. Creating a
      // context per tile blows past the browser's WebGL context limit.
      const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true })
      renderer.setPixelRatio(2)

      /** Flat black on white: the colour-blind silhouette test. */
      function flatten(root) {
        const black = new THREE.MeshBasicMaterial({ color: '#000000' })
        root.traverse(obj => {
          if (obj.isMesh || obj.isInstancedMesh) obj.material = black
          if (obj.isLight) obj.visible = false
        })
      }

      function render(parent, group, id, style, label, opts = {}) {
        const { size = 240, bg = '#152231', yaw = 0.42, silhouette = false } = opts
        const scene = new THREE.Scene()
        scene.background = new THREE.Color(bg)
        const camera = new THREE.PerspectiveCamera(30, 1, 0.1, 40)
        camera.position.set(0, 1.85, 8.2)
        camera.lookAt(0, 1.55, 0)
        scene.add(new THREE.HemisphereLight('#ffffff', '#3a4450', 2.2))
        const key = new THREE.DirectionalLight('#fff3d6', 2.6)
        key.position.set(-4, 7, 6)
        scene.add(key)
        const rim = new THREE.DirectionalLight('#7bc9ce', 0.9)
        rim.position.set(5, 3, -4)
        scene.add(rim)
        const character = createWizard(id, 1, style)
        character.rotation.y = yaw
        if (silhouette) flatten(character)
        scene.add(character)
        renderer.setSize(size, size)
        renderer.render(scene, camera)

        const out = document.createElement('canvas')
        out.width = size * 2
        out.height = size * 2
        out.style.width = `${size}px`
        out.style.height = `${size}px`
        out.getContext('2d').drawImage(renderer.domElement, 0, 0)
        parent.appendChild(out)
        tiles.push({ group, id, name: wizards[id].name, label, png: out.toDataURL('image/png') })
      }

      function caption(parent, text) {
        const fig = document.createElement('figure')
        fig.style.margin = '0'
        parent.appendChild(fig)
        const cap = document.createElement('figcaption')
        cap.textContent = text
        return { fig, cap }
      }

      /* 1. Contact sheet: the spread, at a glance. */
      {
        const strip = document.createElement('div')
        strip.className = 'strip'
        for (const id of ids) {
          const { fig, cap } = caption(strip, `${wizards[id].name} · ${wizards[id].role}`)
          render(fig, 'contact', id, defaultMothStyle, `${wizards[id].name} · ${wizards[id].role}`, { size: 320 })
          fig.appendChild(cap)
        }
        document.getElementById('contact').appendChild(strip)
      }

      /* 2. Silhouettes, colour removed. */
      {
        const strip = document.createElement('div')
        strip.className = 'strip'
        for (const id of ids) {
          const { fig, cap } = caption(strip, `${wizards[id].name} silhouette`)
          render(fig, 'silhouette', id, defaultMothStyle, wizards[id].name, { size: 320, bg: '#ffffff', silhouette: true })
          fig.appendChild(cap)
        }
        document.getElementById('silhouette').appendChild(strip)
      }

      /* 3. Solidity: any hole in a figure shows the magenta behind it. */
      {
        const strip = document.createElement('div')
        strip.className = 'strip magenta'
        for (const yaw of [0, Math.PI / 4]) {
          for (const id of ids) {
            render(strip, 'solid', id, defaultMothStyle, `${wizards[id].name} yaw ${yaw.toFixed(2)}`, { size: 320, yaw, bg: '#ff00ff' })
          }
        }
        document.getElementById('solid').appendChild(strip)
      }

      /* 4. Wardrobe matrix, using each archetype's own slot names. */
      {
        const wardrobe = document.getElementById('wardrobe')
        for (const id of ids) {
          const h2 = document.createElement('h2')
          h2.textContent = `${wizards[id].name}  ·  ${wizards[id].role}  ·  key ${id}`
          wardrobe.appendChild(h2)
          for (const slot of styleSlots(id)) {
            const h3 = document.createElement('h3')
            h3.textContent = slot.label
            wardrobe.appendChild(h3)
            const row = document.createElement('div')
            row.className = 'row'
            for (let i = 0; i < slot.count; i++) {
              // Walk the slot from the default, so the ids stay private to characters.ts.
              let style = defaultMothStyle
              for (let step = 0; step < i; step++) style = cycleStyle(id, style, slot.key, 1)
              const { fig, cap } = caption(row, `${slot.label} · ${styleLabel(id, style, slot.key).label}`)
              render(fig, `wardrobe:${id}:${slot.key}`, id, style, styleLabel(id, style, slot.key).label, { size: 240 })
              fig.appendChild(cap)
            }
            wardrobe.appendChild(row)
          }
        }
      }

      window.__roster = tiles
      window.__voxelTestReady = true
    </script>
  </body>
</html>
